name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ubuntu-deep-check:
    name: Ubuntu deep check
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.1

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Electron test system dependencies
        run: pnpm exec playwright install-deps chromium

      # Coverage is measured on Windows: its win32-only rows are skipped here (Pedro, 2026-10-24).
      - name: Run POSIX deep checks
        run: xvfb-run --auto-servernum pnpm check:deep:posix

      - name: Configure packaged Electron sandbox
        run: |
          sudo chown root:root apps/desktop/out/SlopStop-linux-x64/chrome-sandbox
          sudo chmod 4755 apps/desktop/out/SlopStop-linux-x64/chrome-sandbox

      - name: Run packaged Electron smoke
        run: xvfb-run --auto-servernum pnpm package:launch-smoke

  windows-process-and-package:
    name: Windows process and package proof
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      # The runner's default TEMP is the 8.3 short path C:\Users\RUNNER~1\...; tests take their
      # temporary roots from it, and Project Storage answers broken for 8.3 aliases (CI diagnosis 2, C2).
      - name: Use a long-path temporary folder
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.1

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run fast checks
        run: pnpm check

      # The coverage run includes every integration project, and its thresholds gate here.
      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Build and run packaged Electron tests
        run: pnpm test:e2e

      - name: Run packaged Electron smoke
        run: pnpm package:launch-smoke

      - name: Upload packaged Windows app
        uses: actions/upload-artifact@v4
        with:
          name: slopstop-windows-package
          path: apps/desktop/out/**
          if-no-files-found: error
          retention-days: 7
