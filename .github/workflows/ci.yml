name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ubuntu-deep-check:
    name: Ubuntu deep check
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.1

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Electron test system dependencies
        run: pnpm exec playwright install-deps chromium

      - name: Run deep checks
        run: xvfb-run --auto-servernum pnpm check:deep

  windows-process-and-package:
    name: Windows process and package proof
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.1

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run fast checks
        run: pnpm check

      - name: Run harness integration tests
        run: pnpm test:integration

      - name: Build and run packaged Electron tests
        run: pnpm test:e2e

      - name: Upload packaged Windows app
        uses: actions/upload-artifact@v4
        with:
          name: slopstop-windows-package
          path: apps/desktop/out/**
          if-no-files-found: error
          retention-days: 7
